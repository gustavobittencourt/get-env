
[package]
name = "get-env"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Acha variáveis de ambiente por nome aproximado, copia para o clipboard e mostra uma tabela interativa"

[dependencies]
ratatui = "0.30.2"
regex = "1.13"
unicode-width = "0.2.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSData", "NSArray"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }

